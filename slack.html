}

function allMsg(d, lv) {
  const parts = [parentMsg(d), ...d.stories.map((s, i) => storyMsg(s, i, lv))];
  return {
    html: parts.map(p => p.html).join('<br><br>'),
    text: parts.map(p => p.text).join('\n\n'),
  };
}

let current = {};
function render() {
  const d = day(), lv = level();
  current = {all: allMsg(d, lv), parent: parentMsg(d)};
  d.stories.forEach((s, i) => { current[`s${i}`] = storyMsg(s, i, lv); });
  const card = (key, label) =>
    `<div class="slack-msg"><div class="slack-msg-head"><span>${label}</span>` +
    `<button class="btn small" data-copy="${key}">コピー</button></div>` +
    `<div class="slack-body">${current[key].html}</div></div>`;
  $('#preview').innerHTML = card('parent', '親メッセージ') +
    d.stories.map((s, i) => card(`s${i}`, `記事 ${i + 1}`)).join('');
}

async function copy(key) {
  const {html, text} = current[key];
  try {
    if (window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], {type: 'text/html'}),
        'text/plain': new Blob([text], {type: 'text/plain'}),
      })]);
    } else {
      // http（非セキュア環境）では Clipboard API が使えないため、選択範囲コピーで代替
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      tmp.style.cssText = 'position:fixed;left:-9999px;white-space:pre-wrap';
      document.body.appendChild(tmp);
      const range = document.createRange();
      range.selectNodeContents(tmp);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges(); tmp.remove();
    }
    toast('コピーしました');
  } catch (e) {
    toast('コピーに失敗しました: ' + e.message);
  }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) copy(b.dataset.copy);
});
$('#date').addEventListener('change', render);
document.querySelectorAll('input[name=level]').forEach(r => r.addEventListener('change', render));
if (DAYS.length) render(); else $('#preview').textContent = 'まだ記事がありません。';
</script>

</body>
